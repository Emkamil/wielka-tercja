<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="copyright" content="Copyright (c) 2025-2026 Kamil Machowski">
    <meta name="theme-color" content="#fdeef0">
    <title>Wielka Tercja – ćwiczenia słuchu muzycznego</title>
    <meta name="description" content="Aplikacja przeglądarkowa pomagająca w ćwiczeniu słuchu muzycznego: interwały, akordy, dźwięki i gamy.">

    <meta property="og:url" content="https://emkamil.github.io/wielka-tercja/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Wielka Tercja">
    <meta property="og:description" content="Aplikacja przeglądarkowa pomagająca w ćwiczeniu słuchu muzycznego: interwały, akordy, dźwięki i gamy.">
    <meta property="og:image" content="https://emkamil.github.io/wielka-tercja/icons/icon512.png">
    <link rel="icon" href="icons/icon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">

    <script src="global/scripts/theme-init.js"></script>
    <link rel="stylesheet" href="global/styles/tokens.css">
    <link rel="stylesheet" href="global/styles/base.css">
    <link rel="stylesheet" href="global/styles/home.css">
</head>

<body class="home">
    <header id="site-header"></header>

    <section class="hero">
        <div class="hero__inner">
            <h1>Trenuj słuch muzyczny</h1>
            <p>Wybierz ćwiczenie, ustaw sposób grania i odpowiadaj na to, co usłyszysz.</p>
        </div>
        <!-- pięciolinia; dwa dźwięki na sąsiednich liniach = tercja -->
        <div class="hero__staff" aria-hidden="true">
            <svg class="hero__notes" viewBox="0 0 72 57">
                <ellipse cx="36" cy="42.5" rx="10.5" ry="7" transform="rotate(-18 36 42.5)" />
                <ellipse cx="36" cy="28.5" rx="10.5" ry="7" transform="rotate(-18 36 28.5)" />
            </svg>
        </div>
    </section>

    <main class="home__body">
        <section class="picker" aria-labelledby="picker-title">
            <h2 id="picker-title">Ćwiczenie</h2>
            <div id="exercise-list" class="exercise-list" role="radiogroup" aria-labelledby="picker-title"></div>
        </section>

        <section class="setup" aria-labelledby="setup-title">
            <h2 id="setup-title">Ustawienia</h2>

            <div class="field" id="instrument-field">
                <label for="instrument-select">Instrument</label>
                <select id="instrument-select"></select>
            </div>

            <div class="field" id="style-field">
                <label for="style-select">Sposób gry</label>
                <select id="style-select"></select>
            </div>

            <div class="field">
                <span class="field__label" id="duration-label">Czas trwania dźwięku</span>
                <div class="segmented" id="duration-group" role="radiogroup" aria-labelledby="duration-label"></div>
            </div>
        </section>

        <div class="cta-bar">
            <a id="start-button" class="btn btn--cta" href="exercise.html?type=intervals">Rozpocznij ćwiczenie</a>
        </div>
    </main>

    <script type="module" src="global/scripts/home.js"></script>
</body>

</html>
